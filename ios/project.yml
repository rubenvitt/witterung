name: Witterung

# Xcode-Projekt entsteht mit `xcodegen generate` (im Ordner ios/) und wird nicht
# eingecheckt. Keine Pakete: Shared/ wird in App und Widget mitkompiliert.
options:
  bundleIdPrefix: dev.rubeen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: H95J852PKP
    CODE_SIGN_STYLE: Automatic

targets:
  Witterung:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: WitterungWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.witterung
        PRODUCT_NAME: Witterung
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Witterung
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Witterung zeigt das Wetter an deinem aktuellen Standort."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: DerivedInfo/Witterung.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.rubeen.witterung]
        # Erster Eintrag = Standardgruppe: Token-Einträge landen ohne Angabe im Code
        # in der gemeinsamen Gruppe, App und Widget lesen dasselbe Token.
        keychain-access-groups: [$(AppIdentifierPrefix)dev.rubeen.witterung.shared]
    info:
      path: DerivedInfo/Witterung-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Lokaler Dev-Server über http://localhost
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          # Rückruf der Geräte-Anmeldung (docs/api.md, Anmeldung)
          - CFBundleURLName: dev.rubeen.witterung.auth
            CFBundleURLSchemes: [witterung]

  WitterungWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.witterung.widgets
        PRODUCT_NAME: WitterungWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Witterung
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Witterung zeigt das Wetter an deinem aktuellen Standort."
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: DerivedInfo/WitterungWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.rubeen.witterung]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.rubeen.witterung.shared]
    info:
      path: DerivedInfo/WitterungWidgets-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        NSWidgetUsesLocation: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Logiktests ohne Host-App: Shared und die reinen Logikdateien der App werden
  # mitkompiliert. Ein Host-App-Start hing im Simulator (DTServiceHub) – so laufen
  # die Tests auch ohne Instruments-Dienst.
  WitterungTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WitterungTests
      - path: Shared
      - path: App/Auth.swift
      - path: App/WMSTile.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.witterung.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Witterung:
    build:
      targets:
        Witterung: all
        WitterungTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [WitterungTests]

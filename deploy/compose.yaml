# Witterung auf dem Homelab hinter Traefik, betrieben mit docker compose.
#
# Auf dem Server liegt dieser Ordner als ~/server/witterung/ (compose.yaml, .env, data/).
# Öffentliche Domain, damit das iPhone unterwegs ohne VPN zugreift; geschützt über Pocket ID.
# Geheimnisse stehen in .env (Vorlage .env.example), nie im Repo.

name: witterung

networks:
  proxy:
    external: true

services:
  witterung:
    image: ghcr.io/rubenvitt/witterung:latest
    container_name: witterung
    restart: unless-stopped
    env_file: .env
    environment:
      - WITTERUNG_PUBLIC_URL=https://witterung.rubeen.dev
      - WITTERUNG_BIND=0.0.0.0:8080
      - WITTERUNG_DATA_DIR=/data
      - TZ=Europe/Berlin
    volumes:
      # Der Container läuft als uid/gid 10001: vorher `sudo chown 10001:10001 data`.
      - ./data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.witterung.entrypoints=https"
      - "traefik.http.routers.witterung.rule=Host(`witterung.rubeen.dev`)"
      - "traefik.http.routers.witterung.tls.certresolver=letsencrypt"
      - "traefik.http.services.witterung.loadbalancer.server.port=8080"
